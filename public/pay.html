<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pay your bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F4F6F4; --ink:#14241E; --brand:#0E5C4A; --brand-soft:#DCEAE3;
    --accent:#E8612C; --line:#D6DDD7; --muted:#5E6F66; --ok:#0E5C4A;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--paper); color:var(--ink);
    display:flex; min-height:100dvh; align-items:flex-start; justify-content:center;
    padding:24px 16px;
  }
  .receipt{
    width:100%; max-width:440px; background:#fff; border:1px solid var(--line);
    border-radius:18px; overflow:hidden; box-shadow:0 10px 40px -18px rgba(20,36,30,.35);
  }
  .head{ padding:26px 26px 18px; border-bottom:1px dashed var(--line); }
  .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brand); font-weight:600; margin:0 0 10px;
  }
  .amount{
    font-family:Fraunces,Georgia,serif; font-weight:600;
    font-size:clamp(42px,12vw,60px); line-height:.95; letter-spacing:-.01em;
    font-variant-numeric:tabular-nums; margin:0;
  }
  .amount .cur{ font-size:.42em; color:var(--muted); vertical-align:.5em; margin-right:.2em; }
  .sub{ margin:10px 0 0; color:var(--muted); font-size:14px; }
  .ledger{ padding:18px 26px; }
  .ledger h2{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; font-weight:600; }
  .line{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; font-size:15px; }
  .line + .line{ border-top:1px solid var(--line); }
  .line .v{ font-variant-numeric:tabular-nums; }
  .pay{ padding:8px 26px 26px; }
  .field{ margin:0 0 14px; }
  .field label{ display:block; font-size:13px; color:var(--muted); margin:0 0 6px; }
  .field input{
    width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:11px;
    font:inherit; background:#fff; color:var(--ink);
  }
  .field input:focus-visible{ outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand); }
  .cta{
    width:100%; padding:15px; border:0; border-radius:12px; cursor:pointer;
    background:var(--accent); color:#fff; font:inherit; font-weight:600; font-size:16px;
    transition:transform .08s ease, filter .15s ease;
  }
  .cta:hover{ filter:brightness(1.05); }
  .cta:active{ transform:translateY(1px); }
  .cta:disabled{ opacity:.55; cursor:default; }
  .cta:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .note{ margin:14px 0 0; font-size:12px; color:var(--muted); text-align:center; line-height:1.5; }
  .state{ padding:48px 26px; text-align:center; }
  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    border:3px solid var(--ok); color:var(--ok); border-radius:12px;
    font-family:Fraunces,serif; font-weight:600; font-size:26px; letter-spacing:.08em;
    padding:10px 22px; transform:rotate(-7deg) scale(.6); opacity:0;
    animation:stamp .4s cubic-bezier(.2,.9,.3,1.4) forwards;
  }
  @keyframes stamp{ to{ transform:rotate(-7deg) scale(1); opacity:1; } }
  .state p{ color:var(--muted); margin:18px 0 0; }
  .err{ color:#9a2a14; }
  @media (prefers-reduced-motion:reduce){ .stamp{ animation:none; opacity:1; transform:rotate(-7deg); } .cta{ transition:none; } }
</style>
</head>
<body>
  <main class="receipt" id="root" aria-live="polite">
    <div class="state" id="loading"><p>Loading your bill…</p></div>
  </main>

<script>
  const qs = new URLSearchParams(location.search);
  const intentId = qs.get('intent');
  const root = document.getElementById('root');
  const fmt = (n, cur) => `${cur} ${Number(n).toFixed(2)}`;

  async function load(){
    if(!intentId){ return showError("No payment reference in the link."); }
    try{
      const r = await fetch(`/pay/api/session/${encodeURIComponent(intentId)}`);
      if(!r.ok) throw new Error();
      const s = await r.json();
      s.status === 'paid' ? showPaid(s) : showBill(s);
    }catch{ showError("We couldn't load this bill. Check the link and try again."); }
  }

  function showBill(s){
    const items = s.lineItems.map(i =>
      `<div class="line"><span>${esc(i.name)}</span><span class="v">${fmt(i.cost, s.currency)}</span></div>`
    ).join('');
    root.innerHTML = `
      <div class="head">
        <p class="eyebrow">${esc(s.provider || 'Medical bill')}</p>
        <p class="amount"><span class="cur">${esc(s.currency)}</span>${Number(s.amount).toFixed(2)}</p>
        <p class="sub">Amount due today</p>
      </div>
      <div class="ledger">
        <h2>Itemised charges</h2>
        ${items || '<div class="line"><span>Consolidated charges</span></div>'}
      </div>
      <div class="pay">
        <div class="field">
          <label for="phone">Mobile Money number</label>
          <input id="phone" inputmode="tel" placeholder="${s.payerPhoneMasked || '024 000 0000'}" />
        </div>
        <button class="cta" id="payBtn">Pay ${fmt(s.amount, s.currency)} with MTN MoMo</button>
        <p class="note">You'll get a prompt on your phone to approve this payment.
        Charges are settled to the provider after confirmation.</p>
      </div>`;
    document.getElementById('payBtn').addEventListener('click', () => pay(s));
  }

  async function pay(s){
    const btn = document.getElementById('payBtn');
    btn.disabled = true; btn.textContent = 'Sending prompt…';
    try{
      const r = await fetch(`/pay/api/session/${encodeURIComponent(intentId)}/confirm`, { method:'POST' });
      if(!r.ok) throw new Error();
      showPaid(s);
    }catch{
      btn.disabled = false; btn.textContent = `Pay ${fmt(s.amount, s.currency)} with MTN MoMo`;
      const n = document.querySelector('.note'); if(n){ n.classList.add('err'); n.textContent = 'Payment did not go through. Please try again.'; }
    }
  }

  function showPaid(s){
    root.innerHTML = `<div class="state">
      <div class="stamp">PAID</div>
      <p>${fmt(s.amount, s.currency)} received${s.provider ? ' for ' + esc(s.provider) : ''}.<br/>A receipt has been sent to your records.</p>
    </div>`;
  }

  function showError(msg){
    root.innerHTML = `<div class="state"><p class="err">${esc(msg)}</p></div>`;
  }
  function esc(x){ return String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  load();
</script>
</body>
</html>
