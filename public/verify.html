<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bill Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app.css"/></head><body>
<div class="wrap" style="max-width:560px">
  <div class="top"><div class="brandmark">Verify<span class="dot">.</span></div><span class="muted" id="provname"></span></div>
  <div class="card" id="root"><p class="muted">Loading your bill…</p></div>
  <p class="muted" style="font-size:12px;margin-top:14px">Confirming lets your insurer or other payer know the charges are accurate before they're asked to pay. If something looks wrong, say so instead and the provider will follow up with you directly.</p>
</div>
<div class="toast" id="toast"></div>
<script>
const token=new URLSearchParams(location.search).get('token');
const root=document.getElementById('root');
const toast=(m)=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);};
const esc=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(n)=>Number(n||0).toFixed(2);

async function load(){
  if(!token) return root.innerHTML='<p style="color:var(--bad)">Missing verification link.</p>';
  const r=await fetch(`/verify/api/${encodeURIComponent(token)}`);
  if(!r.ok) return root.innerHTML='<p style="color:var(--bad)">Verification link not found or expired.</p>';
  render(await r.json());
}
function render(v){
  document.getElementById('provname').textContent=v.provider||'';
  const items=(v.lineItems||[]).map(i=>{
    const qty=i.qty&&i.qty>1?` ×${i.qty}`:'';
    const code=i.code?`<span class="muted" style="font-size:11px"> · ${esc(i.code)}</span>`:'';
    return `<div class="line"><span>${esc(i.name)}${qty}${code}</span><span class="num">GHS ${num(i.lineTotal)}</span></div>`;
  }).join('');
  const bd=v.breakdown?`<div class="line muted" style="font-size:12px;margin-top:6px"><span>Subtotal ${num(v.breakdown.subtotal)} · discount ${num(v.breakdown.discount)} · net ${num(v.breakdown.net)}</span></div>`:'';
  if(v.status==='verified'){
    root.innerHTML=`<p class="eyebrow">Verified</p>
      <div class="bignum">GHS ${num(v.amount)}</div>
      <p class="muted">Thanks — you confirmed this bill from ${esc(v.provider)}. Your insurer or other payer can now be asked to pay it.</p>
      <span class="pill settled">Verified</span>`;
    return;
  }
  if(v.status==='disputed'){
    root.innerHTML=`<p class="eyebrow">Disputed</p>
      <div class="bignum">GHS ${num(v.amount)}</div>
      <p class="muted">You disputed this bill from ${esc(v.provider)}. The provider has been notified and will follow up with you.</p>
      ${v.disputeReason?`<p class="muted">Reason given: ${esc(v.disputeReason)}</p>`:''}
      <span class="pill rejected">Disputed</span>`;
    return;
  }
  const chans=v.channelsSent||[];
  const smsNote=chans.length?`<p class="muted" style="font-size:12px;margin-top:10px">You may also have received this by ${chans.map(c=>c==='whatsapp'?'WhatsApp':'text message').join(' and ')}. Replying <b>YES</b> (or the code it included) confirms it the same as clicking below — you don't need to do both.</p>`:'';
  root.innerHTML=`
    <p class="eyebrow">Please verify your bill</p>
    <div class="bignum">GHS ${num(v.amount)}</div>
    <p class="muted" style="margin-top:4px">From ${esc(v.provider)}${v.patientName?' for '+esc(v.patientName):''}</p>
    <div class="ledger" style="margin:16px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">${items||'<p class="muted">No line detail.</p>'}${bd}</div>
    <div class="row">
      <button class="accent" id="conf" onclick="confirmBill()">Confirm — this is accurate</button>
      <button class="ghost" onclick="disputeBill()">Something's wrong</button>
    </div>
    ${smsNote}`;
}
async function confirmBill(){
  const b=document.getElementById('conf'); b.disabled=true; b.textContent='Confirming…';
  const r=await fetch(`/verify/api/${encodeURIComponent(token)}/confirm`,{method:'POST'});
  if(!r.ok){toast('Failed to confirm');b.disabled=false;b.textContent='Retry';return;}
  render(await r.json()); toast('Bill verified — thank you');
}
async function disputeBill(){
  const reason=prompt('What looks wrong? (optional)')||'';
  const r=await fetch(`/verify/api/${encodeURIComponent(token)}/dispute`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});
  if(r.ok){ render(await r.json()); toast('Marked as disputed'); }
}
load();
</script>
</body></html>
