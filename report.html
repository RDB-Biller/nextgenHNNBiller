<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Medical Report — Financing Due Diligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app.css"/>
<style>
.doc{max-width:720px;margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 36px}
.doc h1{font-family:Fraunces,serif;font-weight:600;font-size:26px;margin:0 0 2px}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:6px 0 18px;border-bottom:1px solid var(--line);padding-bottom:14px}
.sec{margin:18px 0}
.sec h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.sec p{margin:0;font-size:14.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:4px 11px;font-size:13px}
.qa{font-size:14px;margin:6px 0}.qa b{color:var(--ink)}
.disc{margin-top:20px;padding:12px 14px;background:#FFF8EE;border:1px solid #F1DDBE;border-radius:10px;font-size:12.5px;color:#7a5b1e}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto;padding:0 4px}
@media print{.bar{display:none}.doc{border:0;margin:0;border-radius:0}body{background:#fff}}
</style></head><body>
<div class="bar"><div class="brandmark" style="font-family:Fraunces,serif;font-weight:600;font-size:20px;padding-top:20px">HNN Biller<span style="color:var(--coral)">.</span></div>
<button class="ghost" onclick="window.print()" style="margin-top:18px">Print / Save PDF</button></div>
<div class="doc" id="doc"><p class="muted">Loading report…</p></div>
<script>
const p=new URLSearchParams(location.search);
const token=p.get('token'); const id=p.get('id'); const key=p.get('key');
const esc=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(n)=>Number(n).toFixed(2);
const chips=(a)=>a&&a.length?`<div class="chips">${a.map(x=>`<span>${esc(x.name)} · GHS ${num(x.cost)}</span>`).join('')}</div>`:'<p class="muted" style="font-size:13px">None recorded</p>';
async function load(){
  let url = token?`/report/api/${encodeURIComponent(token)}`:`/api/v1/financing/reports/${encodeURIComponent(id)}`;
  let opts = token?{}:{headers:{'x-api-key':key||''}};
  const r=await fetch(url,opts);
  if(!r.ok){document.getElementById('doc').innerHTML='<p style="color:var(--bad)">Report not found.</p>';return;}
  render(await r.json());
}
function render(d){
  const qa=(d.qa||[]).filter(x=>x.a).map(x=>`<p class="qa"><b>${esc(x.q)}</b> ${esc(x.a)}</p>`).join('')||'<p class="muted" style="font-size:13px">No Q&amp;A recorded</p>';
  document.getElementById('doc').innerHTML=`
    <h1>Medical Report</h1>
    <div class="meta"><span><b>${esc(d.kind)}</b> report</span><span>${esc(d.provider||'')}</span><span>Patient: ${esc(d.patientName||'—')}</span><span>${esc((d.createdAt||'').slice(0,10))}</span></div>
    <div class="sec"><h3>Working diagnosis</h3><p>${esc(d.diagnosis||'Not stated')}</p></div>
    <div class="sec"><h3>Clinical summary</h3><p>${esc(d.narrative||'')}</p></div>
    <div class="sec"><h3>Investigations</h3>${chips(d.investigations)}</div>
    <div class="sec"><h3>Medications</h3>${chips(d.medications)}</div>
    <div class="sec"><h3>Procedures &amp; consultations</h3>${chips(d.procedures)}</div>
    ${d.other&&d.other.length?`<div class="sec"><h3>Other charges</h3>${chips(d.other)}</div>`:''}
    <div class="sec"><h3>Clinical Q&amp;A</h3>${qa}</div>
    <div class="sec"><h3>Financing request</h3><p>${esc((d.loanType||'').replace('_',' '))} · ${esc(d.currency)} ${num(d.amountRequested)}</p></div>
    <div class="sec"><h3>Clinician</h3><p>${esc(d.clinicianName||'________________')} &nbsp;·&nbsp; Signature: ${d.signedOff?'signed':'________________'}</p></div>
    <div class="disc">${esc(d.disclaimer||'')}</div>`;
}
load();
</script>
</body></html>
