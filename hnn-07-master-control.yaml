openapi: 3.0.3
info:
  title: HNN Biller — Master Control API (SaaS owner)
  version: 1.0.0
  description: 'Manage every organisation on the deployment — clients, payers, EMR/EHR partners — the
    IT leads assigned to them, and each client’s edition. **This is the transition API: move any client
    between commercial and non-commercial instantly, in both directions, with no data loss.**


    ### Editions

    Every client runs on one of two editions in the **same deployment**:


    | Edition | Includes |

    |---|---|

    | `non_commercial` | Billing, payer routing, patient payments, dashboard, notifications, medical reports
    |

    | `commercial` | Everything above **plus** revenue rules & other charges, financing, NHIS ClaimIt
    tracker, agnostic payer tabs, audit ledger |


    Switching is a per-client flag flip — no redeploy, no data migration, and **nothing is deleted on
    downgrade**.

    Commercial-only endpoints return **402 `upgrade_required`** when the caller''s client is non-commercial.

    Check your own entitlement any time with `GET /api/v1/bills/edition`.


    **Base URL:** `https://nextgenhnnbiller-production.up.railway.app`


    _The platform never custodies funds: money moves account-to-account to the provider; fees are accrued
    to the ledger as receivables._'
servers:
- url: https://nextgenhnnbiller-production.up.railway.app
  description: Production
- url: http://localhost:3000
  description: Local
tags:
- name: Overview
- name: Clients
- name: Editions
- name: Payers
- name: EMR partners
- name: IT leads
- name: Licences
- name: Submissions
- name: Revenue
- name: Licensing
- name: Targets
- name: Price Lists
- name: Patient Verification
- name: Messaging
components:
  securitySchemes:
    PlatformKey:
      type: apiKey
      in: header
      name: x-platform-key
      description: SaaS owner master key
paths:
  /api/platform/me:
    get:
      tags:
      - Overview
      summary: Principal, editions and roles
      security:
      - PlatformKey: []
      responses:
        '200':
          description: OK
  /api/platform/overview:
    get:
      tags:
      - Overview
      summary: Counts across the deployment
      security:
      - PlatformKey: []
      responses:
        '200':
          description: OK
  /api/platform/clients:
    get:
      tags:
      - Clients
      summary: All clients with edition + feature map
      description: 'Each client''s verificationChannels ({ sms, whatsapp, includeTreatmentDetail }) is included
        in the listing — all false unless set via PUT .../verification-channels below. Each client''s
        messagingCredentials (its own bring-your-own-credentials provider account, if any) is included
        too, masked to { provider, configured, hint, useOwnCredentials, updatedAt } — see the Messaging
        endpoints below.'
      security:
      - PlatformKey: []
      responses:
        '200':
          description: OK
    post:
      tags:
      - Clients
      summary: Create a client (returns its tenant API key)
      security:
      - PlatformKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                edition:
                  type: string
                  enum:
                  - non_commercial
                  - commercial
                  default: non_commercial
                serviceRoutingCode:
                  type: string
                beneficiaryAccount:
                  type: string
                email:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Created
  /api/platform/clients/{id}/edition:
    put:
      tags:
      - Editions
      summary: Transition a client between editions (both directions)
      description: Instant, reversible, non-destructive. Downgrading stops serving commercial features
        but retains all data; upgrading again restores full access to it.
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - edition
              properties:
                edition:
                  type: string
                  enum:
                  - non_commercial
                  - commercial
      responses:
        '200':
          description: '{ client, name, from, to }'
        '404':
          description: client_not_found
        '422':
          description: unknown_edition
  /api/platform/clients/{id}/verification-channels:
    put:
      tags:
      - Patient Verification
      summary: Turn on SMS and/or WhatsApp delivery of the patient verification message for this client
      description: Off for every channel by default. When a channel is on, the same verification link sent
        automatically at billing time (and on resend) also goes out on that channel, with a one-time reply
        code the patient can text back instead of opening the link — see the Core Billing API's inbound
        webhook (/api/v1/webhooks/messaging-inbound). includeTreatmentDetail is a separate opt-in, off by
        default, for whether the message also lists the treatment/line items; left off, the message carries
        only the amount and the link, consistent with this platform's no-PHI-over-SMS/WhatsApp default.
        Real delivery now runs through Twilio, Africa's Talking, or Hubtel, resolved per send — this
        client's own credentials if it has turned on bring-your-own-credentials, else the platform-wide
        test account if HNN has activated one, else sandbox (log only) — see the Messaging endpoints
        below. Turning a channel on here is safe before any provider is configured or activated — nothing
        sends for real until the server also has MESSAGING_SANDBOX set to false and a usable provider
        resolves for this client.
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Client (tenant) id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sms:
                  type: boolean
                  default: false
                whatsapp:
                  type: boolean
                  default: false
                includeTreatmentDetail:
                  type: boolean
                  default: false
      responses:
        '200':
          description: '{ id, verificationChannels: { sms, whatsapp, includeTreatmentDetail } }'
        '404':
          description: client_not_found
  /api/platform/messaging/providers:
    get:
      tags:
      - Messaging
      summary: Wired-in SMS/WhatsApp providers, their required fields, and WhatsApp support
      description: Twilio, Africa's Talking and Hubtel are all wired in; this lists each one's field
        names for the credentials object used by the two endpoints below (e.g. Twilio needs accountSid,
        authToken, from), plus an honest per-provider whatsapp status — supported, unverified (documented
        behaviour not yet confirmed against a live account from this deployment), or unsupported (the
        provider has no WhatsApp product at all, e.g. Hubtel). encryptionConfigured reports whether the
        server has a CREDENTIAL_ENCRYPTION_KEY set; saving any credentials below fails with 422 until it
        does.
      security:
      - PlatformKey: []
      responses:
        '200':
          description: '{ data: { twilio: {...}, africastalking: {...}, hubtel: {...} }, encryptionConfigured }'
  /api/platform/messaging/test-account:
    get:
      tags:
      - Messaging
      summary: Current state of the platform-wide shared test account (masked)
      description: One shared Twilio/Africa's Talking/Hubtel account HNN can activate for a live test
        and deactivate again when done, used by any client below that hasn't turned on its own bring-your-own-credentials.
        Never returns the encrypted blob or the raw secret — only provider, configured, a last-4-chars
        hint, active, and updatedAt.
      security:
      - PlatformKey: []
      responses:
        '200':
          description: '{ provider, configured, hint, active, updatedAt }'
    put:
      tags:
      - Messaging
      summary: Configure and/or activate or deactivate the platform-wide shared test account
      description: 'Body { provider?, credentials?, active? }. provider is one of twilio, africastalking,
        hubtel — see GET .../messaging/providers for each one''s field names. Omit credentials to change
        only active (the deactivate-when-testing-is-over switch) without resupplying the secret; include
        it to set or replace what''s stored — doing so for a provider other than the one already saved
        clears the old encrypted blob first, so the UI never shows "configured" with a hint for a different
        provider''s secret. Rejects (422 no_credentials_configured) any call that would leave active:true
        with no usable provider+credentials pair, including a bare provider switch with no new credentials
        while still active — send active:false (or the new credentials) explicitly instead. This sits
        underneath the server''s own MESSAGING_SANDBOX switch — while that is true, nothing here is ever
        actually sent, active account or not.'
      security:
      - PlatformKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                  - twilio
                  - africastalking
                  - hubtel
                credentials:
                  type: object
                  description: Raw provider fields (e.g. accountSid/authToken/from for twilio) — see GET
                    .../messaging/providers. Stored encrypted; never echoed back.
                  additionalProperties: true
                active:
                  type: boolean
      responses:
        '200':
          description: '{ provider, configured, hint, active, updatedAt }'
        '422':
          description: no_credentials_configured / unknown_provider / missing_fields
  /api/platform/clients/{id}/messaging-credentials:
    put:
      tags:
      - Messaging
      summary: Configure a client's own "bring your own credentials" provider account
      description: 'Body { useOwnCredentials?, provider?, credentials? }. When useOwnCredentials is true
        and a provider + credentials are saved, this client''s own Twilio/Africa''s Talking/Hubtel account
        is used for every send instead of the platform''s shared test account above — it always wins when
        on. Same provider list, field names, encryption, and masking as the platform test-account endpoint;
        see GET .../messaging/providers. Switching provider without new credentials in the same call clears
        the old encrypted blob rather than keeping it stored under the new provider''s name. Rejects (422
        no_credentials_configured) turning useOwnCredentials on with no usable provider+credentials pair
        saved. Master Control is where this is entered on the client''s behalf today; nothing about the
        storage or sending logic is specific to who calls it.'
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Client (tenant) id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                useOwnCredentials:
                  type: boolean
                  default: false
                provider:
                  type: string
                  enum:
                  - twilio
                  - africastalking
                  - hubtel
                credentials:
                  type: object
                  description: Raw provider fields — see GET .../messaging/providers. Stored encrypted;
                    never echoed back.
                  additionalProperties: true
      responses:
        '200':
          description: '{ id, messagingCredentials: { provider, configured, hint, useOwnCredentials, updatedAt } }'
        '404':
          description: client_not_found
        '422':
          description: no_credentials_configured / unknown_provider / missing_fields
  /api/platform/payers:
    get:
      tags:
      - Payers
      summary: Global payers
      security:
      - PlatformKey: []
      responses:
        '200':
          description: OK
    post:
      tags:
      - Payers
      summary: Create an insurer or corporate payer (returns its payer key)
      security:
      - PlatformKey: []
      responses:
        '201':
          description: Created
  /api/platform/emr-partners:
    get:
      tags:
      - EMR partners
      summary: EMR/EHR vendor partners
      security:
      - PlatformKey: []
      responses:
        '200':
          description: OK
    post:
      tags:
      - EMR partners
      summary: Add an EMR/EHR vendor (returns a partner key)
      security:
      - PlatformKey: []
      responses:
        '201':
          description: Created
  /api/platform/users:
    get:
      tags:
      - IT leads
      summary: All IT leads and platform admins
      security:
      - PlatformKey: []
      responses:
        '200':
          description: OK
    post:
      tags:
      - IT leads
      summary: Assign an IT lead (returns their console key)
      security:
      - PlatformKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - role
              properties:
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  enum:
                  - platform_admin
                  - it_lead_facility
                  - it_lead_payer
                  - it_lead_emr
                orgId:
                  type: string
                  description: required for all roles except platform_admin
      responses:
        '201':
          description: Created
        '422':
          description: unknown_role / orgId_required_for_role
  /api/platform/users/{id}/status:
    put:
      tags:
      - IT leads
      summary: Suspend or restore a lead
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: OK
  /api/platform/users/{id}/rotate-key:
    post:
      tags:
      - IT leads
      summary: Rotate a console key
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: OK
  /api/platform/licenses:
    get:
      tags:
      - Licences
      summary: All licence keys
      security:
      - PlatformKey: []
      responses:
        '200':
          description: OK
    post:
      tags:
      - Licences
      summary: Issue an upgrade key
      security:
      - PlatformKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                edition:
                  type: string
                  enum:
                  - commercial
                  - non_commercial
                  default: non_commercial
                orgId:
                  type: string
                  description: bind to one client so the key cannot be shared
                expiresAt:
                  type: string
                note:
                  type: string
                termMonths:
                  type: integer
                  default: 6
                  description: licence validity window
                feeAmount:
                  type: number
                  default: 0
                  description: licensing fee for the term (0 = free)
      responses:
        '201':
          description: Created
  /api/platform/licenses/{key}/revoke:
    post:
      tags:
      - Licences
      summary: Revoke a key
      security:
      - PlatformKey: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: OK
  /api/platform/submissions:
    get:
      tags:
      - Submissions
      summary: Every claim submission across all developers/tenants
      security:
      - PlatformKey: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - settled
          - authorized
          - rejected
      - name: tenantId
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 200
          maximum: 500
      responses:
        '200':
          description: OK
  /api/platform/submissions/summary:
    get:
      tags:
      - Submissions
      summary: Counts and value by status across everyone
      security:
      - PlatformKey: []
      responses:
        '200':
          description: OK
  /api/platform/submissions/{id}:
    get:
      tags:
      - Submissions
      summary: One submission (enriched)
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: claim_not_found
  /api/platform/submissions/{id}/approve:
    post:
      tags:
      - Submissions
      summary: Approve a submission — triggers the Stanbic A2A transfer to the provider and settles
      description: Runs the same guarded, idempotent authorisation path the payer uses. The provider is
        paid account-to-account; the platform never holds funds; a ledger entry is written.
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Settled (with transferReference)
        '404':
          description: claim_not_found
        '409':
          description: claim_not_pending
  /api/platform/submissions/{id}/decline:
    post:
      tags:
      - Submissions
      summary: Decline a submission with a reason
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: OK
  /api/platform/revenue:
    get:
      tags:
      - Revenue
      summary: SaaS-wide accrued revenue (all clients), by type and by client
      description: Aggregates platform_fee_* ledger entries across every tenant. All figures are accrued
        receivables, not cash held.
      security:
      - PlatformKey: []
      responses:
        '200':
          description: '{ totalAccrued, byType[], byClient[] }'
  /api/platform/revenue/recent:
    get:
      tags:
      - Revenue
      summary: Recent fee activity across all clients
      security:
      - PlatformKey: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          maximum: 500
      responses:
        '200':
          description: OK
  /api/platform/licensing:
    get:
      tags:
      - Licensing
      summary: Current licensing policy
      security:
      - PlatformKey: []
      responses:
        '200':
          description: '{ mode, requireLicense, termMonths, licenseFee, currency }'
    put:
      tags:
      - Licensing
      summary: Set licensing policy (free vs licensed, term, fee)
      description: mode free_non_commercial = fee-free (default). mode licensed = require a live licence;
        set licenseFee per term. Switching to free forces the fee to zero. Switching to licensed starts
        a one-off grace window (default 30 days) during which clients without a licence keep working.
      security:
      - PlatformKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - free_non_commercial
                  - licensed
                termMonths:
                  type: integer
                  default: 6
                licenseFee:
                  type: number
                currency:
                  type: string
                graceDays:
                  type: integer
                  default: 30
                  description: grace window for unlicensed clients after switching to licensed
      responses:
        '200':
          description: OK
  /api/platform/licenses/state:
    get:
      tags:
      - Licensing
      summary: Licence state for every client (edition, expiry, days left, due-soon)
      security:
      - PlatformKey: []
      responses:
        '200':
          description: OK
  /api/platform/clients/{id}/renew:
    post:
      tags:
      - Licensing
      summary: Renew a client’s licence for another term (default 6 months)
      description: Extends from the later of now or current expiry. feeAmount records what was charged
        (0 while free).
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                termMonths:
                  type: integer
                  default: 6
                feeAmount:
                  type: number
                  default: 0
      responses:
        '200':
          description: '{ client, edition, expiresAt, feeAmount }'
  /api/platform/payers/{id}/target:
    put:
      tags:
      - Targets
      summary: Set a payer processing target
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: number
                  description: Target GHS to process
                period:
                  type: string
                  enum:
                  - monthly
                  - sixmonth
                  - yearly
                  - custom
                  default: monthly
                anchor:
                  type: string
                  description: ISO date the schedule counts from
                startDate:
                  type: string
                endDate:
                  type: string
      responses:
        '200':
          description: The saved target
    get:
      tags:
      - Targets
      summary: Progress against a payer target
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ target, processed, remaining, percent, claims, periodStart, periodEnd, daysLeft
            }'
        '404':
          description: no_target
    delete:
      tags:
      - Targets
      summary: Remove a payer target
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: cleared
  /api/platform/targets:
    get:
      tags:
      - Targets
      summary: Progress for all payers with a target
      security:
      - PlatformKey: []
      responses:
        '200':
          description: '{ data:[...] }'
  /api/platform/payers/{id}/pricelist:
    post:
      tags:
      - Price Lists
      summary: Upload a payer pre-approved price list (CSV text)
      description: 'Body { csv, replace? }. CSV columns: code, name, price [, unit, provider, category].
        A provider (tenant id or facility name) sets a facility-specific price; blank rows are the payer
        default.'
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - csv
              properties:
                csv:
                  type: string
                  description: Raw CSV text (Excel exported to CSV works)
                replace:
                  type: boolean
                  default: true
      responses:
        '200':
          description: '{ imported, total, skipped, errors }'
        '422':
          description: csv_required / no_valid_rows
    get:
      tags:
      - Price Lists
      summary: Get a payer price list (or search with q)
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: '{ count, uploadedAt, sample[] } or { data[] } when q set'
    delete:
      tags:
      - Price Lists
      summary: Clear a payer price list
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: cleared
  /api/platform/payers/{id}/reprice:
    put:
      tags:
      - Price Lists
      summary: Toggle whether a payer’s price list governs settlement (default off)
      description: When enabled, claims routed to this payer are repriced to its approved prices (facility-specific
        first, then default, else the billed price). The patient absorbs any gap between billed and approved.
        Default off = the list is reference-only and the billed price governs.
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: '{ payerId, repriceClaims }'
  /api/platform/payers/{id}/require-verification:
    put:
      tags:
      - Patient Verification
      summary: Toggle whether this payer requires the patient to verify their bill first (default off)
      description: When enabled, POST …/authorize (Payer API or secure claim link) is refused with 409
        patient_verification_pending until the patient confirms via the link sent automatically when
        the bill was created. A missing or disputed verification counts the same as pending. See the
        Payer & Claims API.
      security:
      - PlatformKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: '{ payerId, requirePatientVerification }'
        '404':
          description: payer_not_found
